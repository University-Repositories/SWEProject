services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-beat4beat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beat4beat}
      POSTGRES_DB: ${POSTGRES_DB:-beat4beat}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data: